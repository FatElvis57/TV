name: Refresh IPTV stream URLs

on:
  schedule:
    # Daily at 09:23 UTC. Scheduled runs can be delayed by GitHub.
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-iptv-channels
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Refresh matching stream URLs
        run: python scripts/update_channels.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- Channels; then
            echo "No stream URL changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Channels
          git commit -m "Automatically refresh IPTV stream URLs"
          git push
