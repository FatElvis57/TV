
name: Build Combined XMLTV Guide

on:
  workflow_dispatch:

  schedule:
    - cron: "17 7 * * *"

  push:
    paths:
      - "Channels"
      - "epg-config.json"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build-epg.yml"

permissions:
  contents: write

concurrency:
  group: combined-epg-build
  cancel-in-progress: false

jobs:
  build-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and validate EPG
        run: python scripts/build_epg.py

      - name: Commit updated guide if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Guide.xml epg-status.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Update combined XMLTV guide"
          git push origin HEAD:main
